<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة الإدارة | طارق محسن</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="admin.css"></head><body><header><a href="index.html">← عرض الموقع</a><strong>لوحة إدارة البورتفوليو</strong><small>SECURE ADMIN</small></header><main><section id="loginSection" class="panel login"><small>WELCOME BACK</small><h1>تسجيل دخول المدير</h1><p>استخدم حساب Google المعتمد لإدارة الصورة والمشاريع.</p><button id="googleLoginButton">G　تسجيل الدخول باستخدام Google</button><p id="loginMessage" class="message"></p></section><div id="dashboardSection" hidden><section class="panel top"><div><small>CONTROL CENTER</small><h1>إدارة المحتوى</h1><p id="adminEmail"></p></div><button id="logoutButton" class="muted">تسجيل الخروج</button></section><section class="panel"><small>PROFILE</small><h2>الصورة الشخصية</h2><div class="profile-edit"><div class="preview"><img id="adminProfilePreview" hidden alt="معاينة الصورة"><span id="adminProfileFallback">ط م</span></div><div><input id="profileFile" type="file" accept="image/jpeg,image/png,image/webp"><p>صورة رأسية مفضلة، بحد أقصى 8 ميجابايت قبل الضغط.</p><button id="uploadProfileButton">رفع وحفظ الصورة</button><p id="profileMessage" class="message"></p></div></div></section><section class="panel"><small>PROJECT MANAGEMENT</small><h2 id="formTitle">إضافة مشروع جديد</h2><form id="projectForm"><input id="projectId" type="hidden"><input id="oldImagePath" type="hidden"><div class="fields"><label>اسم المشروع بالعربي *<input id="titleAr" required maxlength="120"></label><label>اسم المشروع بالإنجليزي<input id="titleEn" maxlength="120"></label><label>وصف المشروع بالعربي<textarea id="descriptionAr" rows="3"></textarea></label><label>وصف المشروع بالإنجليزي<textarea id="descriptionEn" rows="3"></textarea></label><label>التصنيف<input id="category"></label><label>ترتيب العرض<input id="order" type="number" min="0" value="1"></label><label>رابط المشروع<input id="liveUrl" type="url" placeholder="https://..."></label><label>رابط GitHub<input id="githubUrl" type="url" placeholder="https://github.com/..."></label><label class="full">صورة المشروع<input id="projectImageFile" type="file" accept="image/jpeg,image/png,image/webp"><img id="projectImagePreview" hidden alt="معاينة الصورة"><span><input id="removeProjectImage" type="checkbox"> إزالة الصورة الحالية عند الحفظ</span></label><label class="full"><span><input id="featured" type="checkbox" checked> نشر المشروع على الصفحة الرئيسية</span></label></div><div class="form-actions"><button id="saveButton">حفظ المشروع</button><button id="cancelEditButton" class="muted" type="button" hidden>إلغاء التعديل</button></div></form><p id="adminMessage" class="message"></p></section><section class="panel"><div class="top"><h2>المشاريع الحالية</h2><button id="refreshProjects" class="muted" type="button">تحديث القائمة</button></div><div id="adminProjects"></div></section></div></main><script type="module" src="admin.js"></script></body></html>
